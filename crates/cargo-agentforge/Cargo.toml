[package]
name = "cargo-agentforge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Installs AGENTS-RUST.md into Rust projects"

[dependencies]
agentforge-builder = { path = "../agentforge-builder" }
agentforge-domain = { path = "../agentforge-domain" }
agentforge-core = { path = "../agentforge-core" }
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "cargo-agentforge"
path = "src/main.rs"
